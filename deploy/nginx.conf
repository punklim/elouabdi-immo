# À copier dans /etc/nginx/sites-available/elouabdi (remplacer monsite.ma)
server {
    listen 80;
    server_name monsite.ma www.monsite.ma;
    client_max_body_size 20M;          # taille max des photos envoyées depuis l'administration

    location /media/ {
        alias /srv/elouabdi_immo/media/;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
