{% load i18n %}
<article class="card fx-card">
  <a class="card-photo" href="{{ article.get_absolute_url }}">{% if article.image %}<img src="{{ article.image.url }}" alt="" loading="lazy">{% else %}<span class="ph">{% trans "Photo à venir" %}</span>{% endif %}</a>
  <div class="card-body">
    <p class="meta">{{ article.publie_le|date:"j F Y" }}</p>
    <h3><a href="{{ article.get_absolute_url }}">{{ article.titre_affiche }}</a></h3>
    <p class="meta">{{ article.resume_affiche }}</p>
    <a class="link" href="{{ article.get_absolute_url }}">{% trans "Lire l’article" %}</a>
  </div>
</article>
